project:
  type: website

lang: en                  # 사이트 UI 언어. 한국어 글은 그 글 머리말에 lang: ko 추가

execute:
  freeze: auto            # 코드가 바뀐 글만 다시 실행 (결과는 _freeze/에 저장)

website:
  title: "SeungYong Oh"
  site-url: https://seungyong0223.github.io
  open-graph: true        # 링크 공유 시 미리보기
  twitter-card: true
  navbar:
    left:
      - href: index.qmd       # 홈 = 프로필 페이지
        text: About
      - href: projects/index.qmd
        text: Projects
      - href: publications.qmd
        text: Publications
      - href: notes/index.qmd
        text: Notes
      - href: labs/index.qmd
        text: Labs
      # - href: posts/index.qmd
      #   text: Posts
    right:
      - icon: github
        href: https://github.com/seungyong0223
  page-footer:
    left: "© 2026 SeungYong Oh"
    right: "Built with [Quarto](https://quarto.org)"
  
  # 사이드바: 각 사이드바는 contents에 포함된 페이지에서만 표시됨
  # 새 폴더를 만들면 해당 사이드바에 section 하나 추가
  sidebar:
    - id: notes
      title: "Notes"
      style: docked
      collapse-level: 1       # 과목별로 접힌 상태로 시작
      contents:
        - notes/index.qmd
        - section: "Mathematics"
          contents: "notes/Math/*"
        - section: "Statistical Theory"
          contents: "notes/StatTheory/*"
        - section: "Probability Theory"
          contents: "notes/ProbTheory/*"

    - id: labs
      title: "Labs"
      style: docked
      collapse-level: 1       # 분야별로 접힌 상태로 시작
      contents:
        - labs/index.qmd
        - section: "Biostatistics"
          contents:
            - section: "TMLE"
              contents: "labs/BioStat/TMLE/*"
            - section: "DML"
              contents: "labs/BioStat/DML/*"
            - section: "Survival"
              contents: "labs/BioStat/Survival/*"
        - section: "Bioinformatics"
          contents:
            - section: "Single-Cell"
              contents: "labs/BI/SingleCell/*"

format:
  html:
    theme:
      light: flatly       # 밝은 모드
      dark: darkly        # 어두운 모드 (토글 버튼이 자동 생성됨)
    css: styles.css
    toc: true             # 우측 목차
    code-fold: false      # true면 코드 접기
    code-copy: true
    smooth-scroll: true
